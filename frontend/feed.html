<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram-Clone Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!--Navigation header-->
    <header class="nav-bar">
      <div class="nav-container">
        <div class="nav-logo">
          <h2>Pawster</h2>
        </div>

        <div class="nav-icons">
          <a href="feed.html" class="nav-icon active">🏠</a>
          <a href="profile.html" class="nav-icon">👤</a>
        </div>
      </div>
    </header>

    <!--Main Content-->
    <main class="main-content">
      <div class="feed-container">
        <!--Stories section-->
        <div class="stories-section">
          <div class="stories-container">
            <div class="story-item">
              <div class="story-avatar">
                <img src="images/default-avatar.png" alt="Your Story" />
              </div>
              <span class="story-username">Your Story</span>
            </div>
          </div>
        </div>

        <!--Upload Section-->
        <section class="upload-section">
          <div class="file-input-container">
            <input
              type="file"
              id="imageInput"
              accept="image/*"
              style="display: none"
            />
            <label for="imageInput" class="file-select-btn">Choose Image</label>
            <span
              id="fileName"
              class="file-name"
              style="
                display: none;
                cursor: pointer;
                color: #007bff;
                text-decoration: underline;
              "
              >No file selected</span
            >
          </div>
          <input
            type="text"
            id="captionInput"
            placeholder="Write a caption..."
          />
          <button id="uploadBtn">Upload Post</button>

          <!-- Preview modal/popup -->
          <div
            id="imagePreviewModal"
            class="preview-modal"
            style="display: none"
          >
            <div class="modal-content">
              <span class="close-btn" id="closePreview">&times;</span>
              <img
                id="imagePreview"
                style="max-width: 100%; max-height: 80vh"
              />
            </div>
          </div>
        </section>

        <!--Posts Section-->
        <div class="posts-section" id="postsContainer">
          <!-- Dynamic posts will be loaded here -->
        </div>
      </div>

      <!--Side bar (for larger screens)-->
      <aside class="sidebar">
        <div class="user-profile-card">
          <img
            src="images/default-avatar.png"
            alt="Your Profile"
            class="profile-pic"
          />
          <div class="profile-info">
            <span class="profile-username" id="profileUsername"></span>
            <span class="profile-name" id="profileName"></span>
          </div>
        </div>
        <div class="suggestions-section">
          <h3>Suggestions for you</h3>
          <div id="suggestionsList"></div>
        </div>
      </aside>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="js/feed.js"></script>
  </body>
</html>
