<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawster - Profile</title>

    <!-- Firebase compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <!-- Navigation Header -->
    <header class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <h2>Pawster</h2>
        </div>
        <div class="nav-icons">
          <a href="feed.html" class="nav-icon">🏠</a>
          <a href="profile.html" class="nav-icon active">👤</a>
        </div>
      </div>
    </header>

    <!-- Profile Content -->
    <main class="profile-main">
      <div class="profile-container">
        <!-- Profile Header -->
        <div class="profile-header">
          <div class="profile-image-section">
            <img
              src="images/default-avatar.png"
              alt="profile"
              class="profile-image"
            />
          </div>
          <div class="profile-info-section">
            <div class="profile-title">
              <h1 class="profile-username">username</h1>
              <button class="edit-profile-btn">Edit profile</button>
              <button class="follow-btn" id="followBtn">Follow</button>
              <button class="profile-settings">⚙️</button>
            </div>
            <div class="profile-stats">
              <div class="stat">
                <span class="stat-number">0</span>
                <span class="stat-label">posts</span>
              </div>
              <div class="stat">
                <span class="stat-number">0</span>
                <span class="stat-label">followers</span>
              </div>
              <div class="stat">
                <span class="stat-number">0</span>
                <span class="stat-label">following</span>
              </div>
            </div>
            <div class="profile-bio">
              <span class="bio-name">Your Name</span>
              <p class="bio-text">Your bio goes here...</p>
            </div>
          </div>
        </div>

        <!-- Profile Navigation -->
        <div class="profile-nav">
          <button class="profile-nav-btn active">
            <span>📷</span>
            <span>POSTS</span>
          </button>
          <!-- <button class="profile-nav-btn">
            <span>📺</span>
            <span>REELS</span>
          </button>
          <button class="profile-nav-btn">
            <span>🏷️</span>
            <span>TAGGED</span>
          </button> -->
        </div>

        <!-- Posts Grid -->
        <div class="posts-grid" id="postsGrid">
          <div class="no-posts">
            <div class="no-posts-icon">📷</div>
            <h2>No posts yet</h2>
          </div>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
